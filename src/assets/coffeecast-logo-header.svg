<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradiente dourado sofisticado do CoffeeCast -->
    <linearGradient id="cupGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F3E5AB" />
      <stop offset="45%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#9C7311" />
    </linearGradient>
    <linearGradient id="innerGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#AA7C11" />
      <stop offset="50%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#AA7C11" />
    </linearGradient>
  </defs>

  <!-- ================= SÍMBOLO DO COFFEECAST ================= -->
  <g transform="translate(4, 0)">
    <!-- Círculo pontilhado decorativo externo -->
    <circle
      cx="40"
      cy="40"
      r="36"
      stroke="url(#cupGoldGrad)"
      stroke-width="1.3"
      stroke-dasharray="2.5 2.5"
      opacity="0.6"
    />

    <!-- Fundo suave do selo redondo (vinho sutil para contraste harmonioso) -->
    <circle
      cx="40"
      cy="40"
      r="33"
      fill="#36142D"
      opacity="0.45"
    />

    <!-- Estrela cintilante superior -->
    <path
      d="M40 10 L41.5 14.5 L46 16 L41.5 17.5 L40 22 L38.5 17.5 L34 16 L38.5 14.5 Z"
      fill="url(#cupGoldGrad)"
    />

    <!-- Estrela cintilante menor lateral -->
    <path
      d="M54 18 L55 20.2 L57.5 21 L55 21.8 L54 24 L53 21.8 L50.5 21 L53 20.2 Z"
      fill="#D4AF37"
      opacity="0.85"
    />

    <!-- Vapor estilizado em formato de coração -->
    <path
      d="M35 24 C32 20.5, 27 21.5, 27 25.5 C27 29.5, 35 34, 40 37.5 C45 34, 53 29.5, 53 25.5 C53 21.5, 48 20.5, 45 24 C43.2 25.7, 40.8 27.5, 40 28.2 C39.2 27.5, 36.8 25.7, 35 24 Z"
      fill="none"
      stroke="url(#cupGoldGrad)"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Pires da xícara em dourado -->
    <path
      d="M19 61 C19 61, 26 64.5, 40 64.5 C54 64.5, 61 61, 61 61"
      stroke="url(#cupGoldGrad)"
      stroke-width="2.6"
      stroke-linecap="round"
    />

    <!-- Corpo da xícara em dourado estilizado -->
    <path
      d="M22 40 C22 53.5, 29 60, 40 60 C51 60, 58 53.5, 58 40 Z"
      fill="#4B1E3F"
      stroke="url(#cupGoldGrad)"
      stroke-width="2.2"
    />

    <!-- Friso dourado na borda superior da xícara -->
    <ellipse
      cx="40"
      cy="40"
      rx="18"
      ry="3"
      stroke="url(#cupGoldGrad)"
      stroke-width="1.8"
      fill="#36142D"
    />

    <!-- Asa da xícara em dourado -->
    <path
      d="M57 42.5 C63 42.5, 66.5 46.5, 65 51.5 C63.5 55.5, 59 56.5, 55 54"
      fill="none"
      stroke="url(#cupGoldGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
    />

    <!-- Brilho/friso decorativo sutil no bojo da xícara -->
    <path
      d="M30 47 C34 50, 46 50, 50 47"
      stroke="#F3E5AB"
      stroke-width="1"
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>

  <!-- ================= ESCRITOS ================= -->
  <!-- "CoffeeCast" em branco com tipografia elegante Playfair Display / Georgia -->
  <text
    x="95"
    y="51"
    fill="#FFFFFF"
    font-family="'Playfair Display', Georgia, serif"
    font-size="34"
    font-weight="700"
    letter-spacing="0.5"
  >CoffeeCast</text>

  <!-- "4.0" em dourado vibrante -->
  <text
    x="292"
    y="51"
    fill="url(#cupGoldGrad)"
    font-family="'Playfair Display', Georgia, serif"
    font-size="34"
    font-weight="900"
    letter-spacing="0.2"
  >4.0</text>
</svg>
