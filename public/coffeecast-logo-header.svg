<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradiente dourado sofisticado do CoffeeCast -->
    <linearGradient id="headerCupGoldPub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F3E5AB" />
      <stop offset="50%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#AA7C11" />
    </linearGradient>
    <!-- Gradiente dourado para a xícara preenchida em dourado luminoso -->
    <linearGradient id="headerCupBodyGoldPub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F3E5AB" />
      <stop offset="35%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#B38612" />
    </linearGradient>
  </defs>

  <!-- ================= SÍMBOLO DA XÍCARA DOURADA ================= -->
  <g transform="translate(0, 0)">
    <!-- Círculo pontilhado dourado externo -->
    <circle
      cx="35"
      cy="35"
      r="32"
      stroke="url(#headerCupGoldPub)"
      stroke-width="1.3"
      stroke-dasharray="2.5 2.5"
      opacity="0.85"
    />

    <!-- Fundo vinho translúcido sutil para profundidade sobre qualquer fundo -->
    <circle
      cx="35"
      cy="35"
      r="29"
      fill="#36142D"
      opacity="0.4"
    />

    <!-- Estrela cintilante superior dourada -->
    <path
      d="M35 8 L36.5 12.5 L41 14 L36.5 15.5 L35 20 L33.5 15.5 L29 14 L33.5 12.5 Z"
      fill="url(#headerCupGoldPub)"
    />

    <!-- Estrela cintilante menor lateral direita dourada -->
    <path
      d="M48 16 L49 18.2 L51.5 19 L49 19.8 L48 22 L47 19.8 L44.5 19 L47 18.2 Z"
      fill="#F3E5AB"
    />

    <!-- Vapor estilizado em formato de coração em dourado -->
    <path
      d="M30 21 C27.2 17.8, 22.8 18.7, 22.8 22.2 C22.8 25.8, 30 29.8, 35 32.8 C40 29.8, 47.2 25.8, 47.2 22.2 C47.2 18.7, 42.8 17.8, 40 21 C38.4 22.5, 36.3 24.1, 35 24.7 C33.7 24.1, 31.6 22.5, 30 21 Z"
      fill="none"
      stroke="url(#headerCupGoldPub)"
      stroke-width="1.9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Pires da xícara em dourado -->
    <path
      d="M16 54 C16 54, 23 57.5, 35 57.5 C47 57.5, 54 54, 54 54"
      stroke="url(#headerCupGoldPub)"
      stroke-width="2.6"
      stroke-linecap="round"
    />

    <!-- Corpo da xícara em DOURADO puro / dourado vibrante -->
    <path
      d="M19 35 C19 47.5, 25.5 53.5, 35 53.5 C44.5 53.5, 51 47.5, 51 35 Z"
      fill="url(#headerCupBodyGoldPub)"
      stroke="#AA7C11"
      stroke-width="1"
    />

    <!-- Borda superior da xícara com detalhe marfim/dourado suave -->
    <ellipse
      cx="35"
      cy="35"
      rx="16"
      ry="2.8"
      fill="#F3E5AB"
      stroke="#AA7C11"
      stroke-width="0.9"
    />

    <!-- Asa da xícara em dourado -->
    <path
      d="M50 37.5 C56 37.5, 59.5 41.5, 58 45.8 C56.5 49.5, 52 50.5, 48.5 48"
      fill="none"
      stroke="url(#headerCupGoldPub)"
      stroke-width="2.4"
      stroke-linecap="round"
    />

    <!-- Friso sutil e elegante no bojo da xícara -->
    <path
      d="M26 42 C30 45, 40 45, 44 42"
      stroke="#FAF8F5"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.8"
    />
  </g>

  <!-- ================= TEXTO ================= -->
  <!-- "CoffeeCast" em BRANCO -->
  <text
    x="82"
    y="45"
    fill="#FFFFFF"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="700"
    letter-spacing="0.5"
  >CoffeeCast</text>

  <!-- "4.0" em DOURADO (#D4AF37 com brilho) -->
  <text
    x="254"
    y="45"
    fill="url(#headerCupGoldPub)"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="900"
    letter-spacing="0.2"
  >4.0</text>
</svg>
